name: Build and publish Desk-Companion firmware

on:
  push:
    branches: [main]
    paths:
      - 'Firmware/**/*.ino'
      - '.github/workflows/build-and-publish-firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desk-companion-firmware-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out Desk-Companion
        uses: actions/checkout@v5

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 board core and libraries
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.3
          arduino-cli lib install "U8g2"
          arduino-cli lib install "ArduinoJson@7.4.2"
          arduino-cli lib install "NTPClient"

      - name: Compile both XIAO variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output sketches
          build_board() {
            local name="$1" fqbn="$2" target="$3" flashsize="$4"
            local sketch="sketches/$name"
            mkdir -p "$sketch" "build/$name"
            cp "Firmware/Desk-Companion-XIAO-ESP32-$name.ino" "$sketch/$name.ino"
            arduino-cli compile \
              --fqbn "$fqbn" \
              --build-property "build.flash_size=$flashsize" \
              --output-dir "build/$name" \
              "$sketch"
            local merged
            merged="$(find "build/$name" -maxdepth 1 -type f -name '*.merged.bin' -print -quit)"
            if [[ -z "$merged" ]]; then
              echo "::error::Arduino CLI did not produce a merged binary for $name"
              exit 1
            fi
            cp "$merged" "output/$target"
            test -s "output/$target"
          }
          build_board C3 esp32:esp32:XIAO_ESP32C3:PartitionScheme=min_spiffs desk-companion-c3-merged.bin 4MB
          build_board S3 esp32:esp32:XIAO_ESP32S3 desk-companion-s3-merged.bin 8MB

      - name: Validate merged flash images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name, expected in (
              ('desk-companion-c3-merged.bin', 4*1024*1024),
              ('desk-companion-s3-merged.bin', 8*1024*1024),
          ):
              path = Path('output') / name
              data = path.read_bytes()
              if len(data) != expected:
                  raise SystemExit(f'{name}: expected {expected} bytes, got {len(data)}')
              if data[0] != 0xE9:
                  raise SystemExit(f'{name}: missing ESP bootloader header at offset 0')
              print(f'Validated {name}: {len(data):,} bytes')
          PY

      - name: Upload compiled firmware for inspection
        uses: actions/upload-artifact@v5
        with:
          name: desk-companion-merged-firmware
          path: output/*.bin
          if-no-files-found: error

      - name: Check website publish credential
        env:
          WEBSITE_DEPLOY_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$WEBSITE_DEPLOY_TOKEN" ]]; then
            echo "::error::Add WEBSITE_DEPLOY_TOKEN with Contents read/write access to Robonavigators/Robonavigators-Website."
            exit 1
          fi

      - name: Check out Robonavigators Website
        uses: actions/checkout@v5
        with:
          repository: Robonavigators/Robonavigators-Website
          ref: main
          token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          path: website
          persist-credentials: true

      - name: Overwrite only Desk-Companion binaries
        shell: bash
        run: |
          set -euo pipefail
          destination=website/tools/Firmware
          test -f "$destination/manifest_desk_companion.json"
          test -f "$destination/desk-companion-c3-merged.bin"
          test -f "$destination/desk-companion-s3-merged.bin"
          cp output/desk-companion-c3-merged.bin "$destination/desk-companion-c3-merged.bin"
          cp output/desk-companion-s3-merged.bin "$destination/desk-companion-s3-merged.bin"

      - name: Commit and push firmware replacements
        working-directory: website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/Firmware/desk-companion-c3-merged.bin \
                  tools/Firmware/desk-companion-s3-merged.bin
          if git diff --cached --quiet; then
            echo "Both published binaries are already up to date."
            exit 0
          fi
          git commit -m "chore(firmware): update Desk-Companion C3 and S3 merged images"
          git push origin HEAD:main

      - name: Publish stable GitHub Release with both firmware binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: firmware-build-${{ github.run_number }}-${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -s output/desk-companion-c3-merged.bin
          test -s output/desk-companion-s3-merged.bin
          gh release create "$RELEASE_TAG" \\
            output/desk-companion-c3-merged.bin \\
            output/desk-companion-s3-merged.bin \\
            --target "$SOURCE_SHA" \\
            --title "Desk-Companion firmware build ${{ github.run_number }}" \\
            --notes "Stable automated build from commit $SOURCE_SHA. Both XIAO ESP32-C3 (Minimal SPIFFS) and XIAO ESP32-S3 (default partition) merged flash images compiled and validated. Firmware was published to Robonavigators-Website. Hardware testing is still recommended." \\
            --latest
