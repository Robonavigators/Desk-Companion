name: Publish stable Desk-Companion OTA assets
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  stable-ota:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: arduino/setup-arduino-cli@v2
      - name: Install toolchain
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.3
          arduino-cli lib install U8g2
          arduino-cli lib install ArduinoJson@7.4.2
          arduino-cli lib install NTPClient
      - name: Build board-specific OTA application binaries
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Stable releases require vMAJOR.MINOR.PATCH tags"; exit 1; }
          mkdir -p ota
          build() {
            local board="$1" fqbn="$2" target="$3"
            mkdir -p "sketches/$board" "build/$board"
            cp "Firmware/Desk-Companion-XIAO-ESP32-$board.ino" "sketches/$board/$board.ino"
            sed -i "s/#define DESK_FIRMWARE_VERSION \"v0.0.0\"/#define DESK_FIRMWARE_VERSION \"$RELEASE_TAG\"/" "sketches/$board/$board.ino"
            arduino-cli compile --fqbn "$fqbn" --output-dir "build/$board" "sketches/$board"
            local app
            app="$(find "build/$board" -maxdepth 1 -name '*.ino.bin' -print -quit)"
            test -n "$app"
            cp "$app" "ota/$target"
            test -s "ota/$target"
          }
          build C3 esp32:esp32:XIAO_ESP32C3:PartitionScheme=min_spiffs desk-companion-c3-ota.bin
          build S3 esp32:esp32:XIAO_ESP32S3 desk-companion-s3-ota.bin
      - name: Attach binaries to published stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" ota/*.bin --clobber
