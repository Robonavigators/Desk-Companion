name: Publish stable Desk-Companion OTA assets
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable version (vMAJOR.MINOR.PATCH); builds both variants, then publishes the release'
        required: true
        type: string
  release:
    types: [published]
permissions:
  contents: write
jobs:
  stable-ota:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}
      - uses: arduino/setup-arduino-cli@v2
      - name: Install toolchain
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.3
          arduino-cli lib install U8g2
          arduino-cli lib install ArduinoJson@7.4.2
          arduino-cli lib install NTPClient
      - name: Build board-specific OTA application binaries
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Stable releases require vMAJOR.MINOR.PATCH tags"; exit 1; }
          mkdir -p ota
          build() {
            local board="$1" fqbn="$2" target="$3" flashsize="$4"
            mkdir -p "sketches/$board" "build/$board"
            cp "Firmware/Desk-Companion-XIAO-ESP32-$board.ino" "sketches/$board/$board.ino"
            sed -i "s/#define DESK_FIRMWARE_VERSION \"v0.0.0\"/#define DESK_FIRMWARE_VERSION \"$RELEASE_TAG\"/" "sketches/$board/$board.ino"
            arduino-cli compile --fqbn "$fqbn" --build-property "build.flash_size=$flashsize" --output-dir "build/$board" "sketches/$board"
            local app
            app="$(find "build/$board" -maxdepth 1 -name '*.ino.bin' -print -quit)"
            test -n "$app"
            cp "$app" "ota/$target"
            test -s "ota/$target"
          }
          build C3 esp32:esp32:XIAO_ESP32C3:PartitionScheme=min_spiffs desk-companion-c3-ota.bin 4MB
          build S3 esp32:esp32:XIAO_ESP32S3 desk-companion-s3-ota.bin 8MB
      - name: Validate OTA binaries and digests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for board in ('c3', 's3'):
              image = Path(f'ota/desk-companion-{board}-ota.bin')
              data = image.read_bytes()
              if not 1024 < len(data) < 4000000 or data[0] != 0xE9:
                  raise SystemExit(f'Invalid application image: {image}')
              print(f'Validated {image}: {len(data):,} bytes')
          PY
          (cd ota && sha256sum *.bin) > ota/SHA256SUMS.txt
      - name: Publish both variants together (manual stable release)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to overwrite stable firmware."
            exit 1
          fi
          gh release create "$RELEASE_TAG" ota/*.bin ota/SHA256SUMS.txt --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes "Stable Desk-Companion firmware for XIAO ESP32-C3 and ESP32-S3. Install via the Web Dashboard or USB web flasher."
      - name: Attach OTA images to an existing GitHub-UI release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" ota/*.bin ota/SHA256SUMS.txt --clobber
