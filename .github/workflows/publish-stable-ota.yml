name: Publish stable Desk-Companion OTA assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New stable version (vMAJOR.MINOR.PATCH)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desk-companion-stable-ota
  cancel-in-progress: true

jobs:
  stable-ota:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate version and reject existing tags or releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::Use vMAJOR.MINOR.PATCH without leading zeros"; exit 1; }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to overwrite it."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag already exists; refusing to reuse it."
            exit 1
          fi
          python3 - "$RELEASE_TAG" <<'PY'
          import json, re, subprocess, sys
          requested = tuple(map(int, sys.argv[1][1:].split('.')))
          releases = json.loads(subprocess.check_output(['gh','api','repos/{owner}/{repo}/releases','--paginate']))
          versions = [tuple(map(int, m.groups())) for r in releases if not r['draft'] and not r['prerelease'] if (m := re.fullmatch(r'v(\d+)\.(\d+)\.(\d+)', r['tag_name']))]
          if versions and requested <= max(versions):
              sys.exit('Stable version must exceed all existing stable semantic versions')
          PY

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install toolchain
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.3
          arduino-cli lib install U8g2
          arduino-cli lib install ArduinoJson@7.4.2
          arduino-cli lib install NTPClient

      - name: Compile board-specific OTA application images
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ota
          build() {
            local board="$1" fqbn="$2" target="$3" flashsize="$4"
            mkdir -p "sketches/$board" "build/$board"
            cp "Firmware/Desk-Companion-XIAO-ESP32-$board.ino" "sketches/$board/$board.ino"
            grep -q '^#define DESK_FIRMWARE_VERSION "v0.0.0"$' "sketches/$board/$board.ino"
            sed -i "s/^#define DESK_FIRMWARE_VERSION \"v0.0.0\"$/#define DESK_FIRMWARE_VERSION \"$RELEASE_TAG\"/" "sketches/$board/$board.ino"
            grep -Fqx "#define DESK_FIRMWARE_VERSION \"$RELEASE_TAG\"" "sketches/$board/$board.ino"
            arduino-cli compile --fqbn "$fqbn" --build-property "build.flash_size=$flashsize" --output-dir "build/$board" "sketches/$board"
            local app
            app="$(find "build/$board" -maxdepth 1 -type f -name '*.ino.bin' -print -quit)"
            test -n "$app"
            cp "$app" "ota/$target"
            test -s "ota/$target"
          }
          build C3 esp32:esp32:XIAO_ESP32C3:PartitionScheme=min_spiffs desk-companion-c3-ota.bin 4MB
          build S3 esp32:esp32:XIAO_ESP32S3 desk-companion-s3-ota.bin 8MB

      - name: Validate both OTA images and SHA-256 checksums
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          release_tag = os.environ['RELEASE_TAG'].encode('ascii')
          for board in ('c3', 's3'):
              image = Path(f'ota/desk-companion-{board}-ota.bin')
              data = image.read_bytes()
              if not 1024 < len(data) < 4000000 or data[0] != 0xE9:
                  raise SystemExit(f'Invalid OTA application image: {image}')
              if release_tag + b'\\x00' not in data:
                  raise SystemExit(f'Embedded firmware version does not match release tag: {image}')
              print(f'Validated {image}: {len(data):,} bytes; embedded version matches {release_tag.decode()}')
          PY
          (cd ota && sha256sum desk-companion-c3-ota.bin desk-companion-s3-ota.bin > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - name: Upload verified images to draft stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag or release already exists; refusing to overwrite."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            ota/desk-companion-c3-ota.bin \
            ota/desk-companion-s3-ota.bin \
            ota/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Desk-Companion $RELEASE_TAG" \
            --notes "Stable OTA application images for XIAO ESP32-C3 and ESP32-S3. SHA-256 checksums are included. For first-time USB installation use the merged images on Robonavigators Tool Hub. Test on physical hardware before general deployment." \
            --draft

      - name: Verify published GitHub API metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release.json
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          release = json.loads(Path('release.json').read_text())
          tag = release['tag_name']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag)
          assert release['draft'] and not release['prerelease']
          assets = {a['name']: a for a in release['assets']}
          for board in ('c3', 's3'):
              name = f'desk-companion-{board}-ota.bin'
              a = assets[name]
              assert a['state'] == 'uploaded'
              assert a['size'] == Path('ota', name).stat().st_size
              import hashlib
              assert a['digest'] == 'sha256:' + hashlib.sha256(Path('ota', name).read_bytes()).hexdigest()
              assert a['browser_download_url'] == f'https://github.com/Robonavigators/Desk-Companion/releases/download/{tag}/{name}'
          assert 'SHA256SUMS.txt' in assets
          print('Release metadata, asset names, sizes, and GitHub digests verified')
          PY

      - name: Publish verified stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' | grep -Fx "$RELEASE_TAG"
